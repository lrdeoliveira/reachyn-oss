# nginx como front do php-fpm (porta 8000). Roda non-root (www-data, AUD-017): todos
# os caminhos graváveis ficam em /tmp e os logs vão pro stdout/stderr do container.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 256m;           # uploads: vídeo final montado (Histórias, até 200MB no app) / amostra de voz

  # caminhos temporários graváveis por www-data (non-root)
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  server {
    listen 8000;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $realpath_root;
      fastcgi_read_timeout 600;        # pesquisa profunda síncrona leva minutos
    }

    # não servir dotfiles (exceto .well-known)
    location ~ /\.(?!well-known).* { deny all; }
  }
}
