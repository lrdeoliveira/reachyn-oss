; Pool php-fpm do console (substitui o www.conf default da imagem).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; pesquisa profunda é síncrona e pode levar minutos — não matar o worker antes disso
; (alinhado ao fastcgi_read_timeout do nginx e ao timeout do console p/ o engine).
request_terminate_timeout = 700

; CRÍTICO: NÃO limpar o env — o Laravel lê DB_*, APP_KEY, tokens etc. das variáveis
; de ambiente do container (docker-compose). clear_env=yes (default) deixaria o app sem config.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
