; Overrides de produção do PHP (console). Carregado por último (zz-) em conf.d.
; max_execution_time alto: a pesquisa profunda síncrona pode levar minutos.
max_execution_time = 700
memory_limit = 256M
; upload do vídeo final montado (Histórias) pode chegar a ~200MB; o app valida o teto por tipo.
upload_max_filesize = 256M
post_max_size = 256M
expose_php = Off
